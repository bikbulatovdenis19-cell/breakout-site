<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">BreakOut multisport field</title>
  <desc id="desc">A single panoramic field composed of diagonal hockey, football, basketball and tennis court sections.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#132019"/><stop offset="1" stop-color="#07100a"/></linearGradient>
    <linearGradient id="hockeyBg" x1="0" x2="1"><stop stop-color="#102419"/><stop offset="1" stop-color="#0c1712"/></linearGradient>
    <linearGradient id="soccerBg" x1="0" x2="1"><stop stop-color="#13281a"/><stop offset="1" stop-color="#0b1710"/></linearGradient>
    <linearGradient id="basketBg" x1="0" x2="1"><stop stop-color="#1d2517"/><stop offset="1" stop-color="#0d1610"/></linearGradient>
    <linearGradient id="tennisBg" x1="0" x2="1"><stop stop-color="#14231d"/><stop offset="1" stop-color="#091612"/></linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="0.35"/></filter>
    <clipPath id="clipH"><polygon points="0,0 430,0 335,560 0,560"/></clipPath>
    <clipPath id="clipS"><polygon points="355,0 790,0 690,560 260,560"/></clipPath>
    <clipPath id="clipB"><polygon points="715,0 1145,0 1055,560 620,560"/></clipPath>
    <clipPath id="clipT"><polygon points="1070,0 1400,0 1400,560 975,560"/></clipPath>
  </defs>
  <rect width="1400" height="560" rx="40" fill="url(#bg)"/>

  <!-- Hockey -->
  <g clip-path="url(#clipH)">
    <rect width="470" height="560" fill="url(#hockeyBg)"/>
    <g transform="translate(28 52)" fill="none" stroke="#8ef14e" stroke-opacity=".72" stroke-width="3" filter="url(#soft)">
      <rect x="0" y="0" width="400" height="456" rx="74"/>
      <line x1="200" y1="0" x2="200" y2="456"/>
      <circle cx="200" cy="228" r="58"/>
      <circle cx="96" cy="128" r="44"/><circle cx="96" cy="328" r="44"/>
      <circle cx="304" cy="128" r="44"/><circle cx="304" cy="328" r="44"/>
      <line x1="88" y1="0" x2="88" y2="456" stroke-opacity=".35"/>
      <line x1="312" y1="0" x2="312" y2="456" stroke-opacity=".35"/>
    </g>
    <text x="62" y="520" fill="#dfffc9" fill-opacity=".58" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700" letter-spacing="3">HOCKEY</text>
  </g>

  <!-- Football / soccer -->
  <g clip-path="url(#clipS)">
    <rect x="260" width="560" height="560" fill="url(#soccerBg)"/>
    <g transform="translate(338 54)" fill="none" stroke="#a8f563" stroke-opacity=".66" stroke-width="3" filter="url(#soft)">
      <rect x="0" y="0" width="408" height="452" rx="8"/>
      <line x1="204" y1="0" x2="204" y2="452"/>
      <circle cx="204" cy="226" r="56"/>
      <circle cx="204" cy="226" r="4" fill="#a8f563" stroke="none"/>
      <rect x="0" y="132" width="72" height="188"/>
      <rect x="336" y="132" width="72" height="188"/>
      <rect x="0" y="174" width="28" height="104"/>
      <rect x="380" y="174" width="28" height="104"/>
      <path d="M72 174a58 58 0 0 1 0 104M336 174a58 58 0 0 0 0 104"/>
    </g>
    <text x="428" y="520" fill="#e8ffd8" fill-opacity=".58" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700" letter-spacing="3">FOOTBALL</text>
  </g>

  <!-- Basketball -->
  <g clip-path="url(#clipB)">
    <rect x="620" width="570" height="560" fill="url(#basketBg)"/>
    <g transform="translate(700 54)" fill="none" stroke="#b8ed58" stroke-opacity=".67" stroke-width="3" filter="url(#soft)">
      <rect x="0" y="0" width="410" height="452" rx="6"/>
      <line x1="205" y1="0" x2="205" y2="452"/>
      <circle cx="205" cy="226" r="52"/>
      <rect x="0" y="132" width="104" height="188"/>
      <rect x="306" y="132" width="104" height="188"/>
      <circle cx="104" cy="226" r="92" stroke-dasharray="144 500"/>
      <circle cx="306" cy="226" r="92" stroke-dasharray="144 500" transform="rotate(180 306 226)"/>
      <line x1="52" y1="208" x2="52" y2="244"/><circle cx="60" cy="226" r="10"/>
      <line x1="358" y1="208" x2="358" y2="244"/><circle cx="350" cy="226" r="10"/>
    </g>
    <text x="782" y="520" fill="#efffcf" fill-opacity=".58" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700" letter-spacing="3">BASKETBALL</text>
  </g>

  <!-- Tennis -->
  <g clip-path="url(#clipT)">
    <rect x="975" width="425" height="560" fill="url(#tennisBg)"/>
    <g transform="translate(1038 72)" fill="none" stroke="#8eeec5" stroke-opacity=".72" stroke-width="3" filter="url(#soft)">
      <rect x="0" y="0" width="330" height="414" rx="4"/>
      <rect x="36" y="0" width="258" height="414"/>
      <line x1="0" y1="207" x2="330" y2="207"/>
      <line x1="165" y1="118" x2="165" y2="296"/>
      <line x1="36" y1="118" x2="294" y2="118"/>
      <line x1="36" y1="296" x2="294" y2="296"/>
    </g>
    <text x="1128" y="520" fill="#d8fff0" fill-opacity=".58" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700" letter-spacing="3">TENNIS</text>
  </g>

  <!-- diagonal seams -->
  <g stroke="#caff90" stroke-opacity=".16" stroke-width="2">
    <line x1="430" y1="0" x2="335" y2="560"/>
    <line x1="790" y1="0" x2="690" y2="560"/>
    <line x1="1145" y1="0" x2="1055" y2="560"/>
  </g>
  <rect x="1.5" y="1.5" width="1397" height="557" rx="39" fill="none" stroke="#caff90" stroke-opacity=".16" stroke-width="3"/>
</svg>
